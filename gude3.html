<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>말해U - 공지사항</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="screen-home">

    <h1>말해U 공지사항 및 안내</h1>
    <h2>궁금한 내용을 검색해 보시거나 목록에서 선택해 주세요.</h2>

    <div class="guide-container card-box">
      
      <div class="search-wrapper">
        <div class="search-box">
          <select class="search-select">
            <option>전체</option>
            <option>제목</option>
            <option>내용</option>
          </select>
          <input type="text" class="search-input" placeholder="검색어를 입력해 주세요.">
          <button class="search-btn">🔍</button>
        </div>
      </div>

      <div class="guide-list">
        
        <div class="guide-item" onclick="alert('첫 번째 공지 내용 준비 중입니다!')">
          <span class="g-badge">음성인식</span>
          <span class="g-title">천천히 말씀하셔도 모든 음성을 또박또박 인식합니다.</span>
          <span class="g-author">관리자</span>
          <span class="g-date">2026.05.27</span>
        </div>

        <div class="guide-item" onclick="alert('두 번째 공지 내용 준비 중입니다!')">
          <span class="g-badge">기능안내</span>
          <span class="g-title">터치가 어려우신 분들을 위한 자동 대기 시스템 도입 안내</span>
          <span class="g-author">관리자</span>
          <span class="g-date">2026.05.24</span>
        </div>

        <div class="guide-item" onclick="alert('세 번째 공지 내용 준비 중입니다!')">
          <span class="g-badge">이용방법</span>
          <span class="g-title">귀가 어두우신 어르신들을 위한 화면 자막 크기 확대 방법</span>
          <span class="g-author">관리자</span>
          <span class="g-date">2026.05.20</span>
        </div>

        <div class="guide-item" onclick="alert('네 번째 공지 내용 준비 중입니다!')">
          <span class="g-badge">점검안내</span>
          <span class="g-title">시스템 안정화를 위한 실시간 데이터베이스 최적화 작업 완료</span>
          <span class="g-author">작성자</span>
          <span class="g-date">2026.05.15</span>
        </div>

      </div> <div class="back-button-wrapper">
        <button class="main-btn back-btn" onclick="location.href='index.html'">메인으로 돌아가기</button>
      </div>

    </div> </div> </body>
</html>
