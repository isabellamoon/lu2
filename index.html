<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>말해U</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="screen-home">

    <h1>말해U 키오스크 입니다</h1>
    <h2>느려도 괜찮아요. 천천히 시작하세요. 기다려 드릴게요.</h2>

    <div class="mascot-container">
      <img src="말해유.png" alt="말해유" class="mascot-img">
    </div>

    <div class="main-layout-container">

      <div id="kiosk-content">
        <p id="status">음성으로 말씀하시면 바로 도와드립니다.</p>
        <div class="button-group">
          <button class="main-btn" onclick="startListening()">시작하기</button>
          <button class="main-btn" onclick="reset()">처음으로</button>
        </div>
      </div>

      <section id="MENU" class="side-menu">
        <p class="card-text">무엇이든 물어보세요.</p>
        <div class="button-group">
          <button class="main-btn" onclick="openComplaintGuide()">말해U란</button> 
          <button class="main-btn" onclick="openComplaintGuide()">궁금해요</button> 
        </div>
      </section>

    </div> </div> <script src="script.js"></script>
</body>
</html>
