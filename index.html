<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>말해U</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="screen-home">

    <h1>말해U 키오스크 입니다</h1>
    <h2>느려도 괜찮아요. 천천히 시작하세요. 기다려 드릴게요.</h2>

    <div class="mascot-container">
      <img src="말해유.png" alt="말해유" class="mascot-img">
    </div>

    <div class="main-layout-container">

      <div class="left-column">
        
        <div id="kiosk-content" class="card-box">
          <p id="status" class="card-text">음성으로 말씀하시면 바로 도와드립니다.</p>
          <div class="button-group">
            <button class="main-btn" onclick="startListening()">시작하기</button>
            <button class="main-btn" onclick="reset()">처음으로</button>
          </div>
        </div>

        <div id="kiosk-info" class="card-box">
          <p class="card-text">우리 말해U는요 ...</p>
          <div class="button-group">
            <button class="main-btn" onclick="openComplaintGuide()">말해U란</button> 
            <button class="main-btn" onclick="openGuide2()">궁금해요</button> 
          </div>
        </div>

      </div> <div id="MENU" class="card-box board-box">
        
        <div class="board-header">
          <h3>공지 및 안내</h3>
          <button class="more-btn">+</button>
        </div>

        <div class="board-tabs">
          <span class="tab-item active">공지</span>
          <span class="tab-item">도움말</span>
          <span class="tab-item">문의</span>
        </div>

        <div class="board-list">
          
          <div class="list-item" onclick="openGuide3()">
            <span class="badge">공지사항</span>
            <span class="item-title">천천히 말씀하셔도 음성을 인식합니다.</span>
            <span class="item-date">05.27</span>
          </div>
          
          <div class="list-item" onclick="openGuide4()">
            <span class="badge">업데이트</span>
            <span class="item-title">새로운 안내 가이드 화면이 추가되었습니다.</span>
            <span class="item-date">05.20</span>
          </div>
          
          <div class="list-item" onclick="openGuide5()">
            <span class="badge">문의</span>
            <span class="item-title">키오스크 사용 중 불편한 점 접수창 안내</span>
            <span class="item-date">05.15</span>
          </div>
          
        </div> </div> </div> </div> <script src="script.js"></script>
</body>
</html>
